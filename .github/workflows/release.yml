name: Release

on:
  push:
    tags:
      - 'css-to-dtcg@*'
      - 'export-design-tokens@*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - name: Check tag matches package version
        run: |
          PACKAGE="${TAG%@*}"
          VERSION="${TAG##*@}"
          case "$PACKAGE" in
            css-to-dtcg) DIR=packages/css-to-dtcg ;;
            export-design-tokens) DIR=packages/figma-plugin ;;
            *) echo "::error::Unknown package in tag $TAG"; exit 1 ;;
          esac
          ACTUAL=$(node -p "require('./$DIR/package.json').version")
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "::error::Tag $TAG does not match $PACKAGE version $ACTUAL"
            exit 1
          fi
          {
            echo "PACKAGE=$PACKAGE"
            echo "VERSION=$VERSION"
            echo "DIR=$DIR"
          } >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Publish to npm
        if: env.PACKAGE == 'css-to-dtcg'
        working-directory: packages/css-to-dtcg
        run: |
          if npm view "css-to-dtcg@$VERSION" version > /dev/null 2>&1; then
            echo "css-to-dtcg@$VERSION is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Package Figma plugin
        if: env.PACKAGE == 'export-design-tokens'
        working-directory: packages/figma-plugin
        run: zip -r "$GITHUB_WORKSPACE/export-design-tokens-$VERSION.zip" manifest.json dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$DIR/CHANGELOG.md" > release-notes.md
          # Keep "Latest release" pointing at the plugin download.
          if [ "$PACKAGE" = export-design-tokens ]; then
            ASSETS="export-design-tokens-$VERSION.zip"
            LATEST=true
          else
            ASSETS=""
            LATEST=false
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ -n "$ASSETS" ]; then gh release upload "$TAG" $ASSETS --clobber; fi
          else
            gh release create "$TAG" $ASSETS --title "$TAG" --notes-file release-notes.md --latest=$LATEST
          fi
