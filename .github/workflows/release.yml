name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./packages/css-to-dtcg/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match css-to-dtcg version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package Figma plugin
        working-directory: packages/figma-plugin
        run: zip -r "$GITHUB_WORKSPACE/export-design-tokens-$TAG.zip" manifest.json dist

      - name: Publish to npm
        working-directory: packages/css-to-dtcg
        run: |
          if npm view "css-to-dtcg@$VERSION" version > /dev/null 2>&1; then
            echo "css-to-dtcg@$VERSION is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/css-to-dtcg/CHANGELOG.md > release-notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "export-design-tokens-$TAG.zip" --clobber
          else
            gh release create "$TAG" "export-design-tokens-$TAG.zip" --title "$TAG" --notes-file release-notes.md
          fi
